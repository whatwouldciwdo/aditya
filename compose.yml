services:
  postgres:
    image: postgres:18-alpine
    container_name: aditya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aditya}
      POSTGRES_USER: ${POSTGRES_USER:-aditya_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aditya_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aditya_app} -d ${POSTGRES_DB:-aditya}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - aditya_postgres_data:/var/lib/postgresql/data

volumes:
  aditya_postgres_data:
